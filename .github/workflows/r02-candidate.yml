# R02 final-assembly candidate: the mandatory pinned-toolchain acceptance gate and the RuneLite 1.13.8 runtime
# classpath lock. Public inputs only: this repository, the pinned foundation commit and RuneLite's public source.
# Private inputs (frozen review package, Lane Inputs ZIP, review art) never enter CI; checks that need them are
# reported SKIPPED by name. Nothing here starts the RuneLite client or touches an account.
name: r02-candidate

on:
  push:
    branches: ['dev/r02-final-assembly', 'fix/r02-normal-account-launch']
  workflow_dispatch:

permissions:
  contents: read

env:
  FOUNDATION_COMMIT: aefb1d79f680ef2c184e24b82e487db08d05c879
  RUNELITE_COMMIT: 8397ec7131ec029bef30ab8ae835b3eb3ebffd9a

jobs:
  quick-launch-windows:
    name: quick launch preparation on Windows with Java 17 (owner-shaped)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: START-R02.cmd preparation under Windows PowerShell 5.1, JAVA_HOME = Java 17, no Temurin 11 set up
        shell: powershell
        run: .\.github\ci\quick-launch-windows.ps1

  pinned-gate:
    name: pinned gate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Fetch the pinned foundation commit (read-only input)
        run: git fetch --depth=1 origin "$FOUNDATION_COMMIT"
      - uses: actions/checkout@v4
        with:
          repository: runelite/runelite
          ref: ${{ env.RUNELITE_COMMIT }}
          path: .ci/runelite
          fetch-depth: 1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11.0.33+10'
      - name: Linux font environment matches the Windows target (Arial metrics)
        if: runner.os == 'Linux'
        # Java's logical Dialog font follows fontconfig's sans-serif choice: DejaVu Sans on this runner, Arial on
        # Windows. DejaVu's wider glyphs change layout-at-width checks (e.g. the 225 px selector). Liberation Sans is
        # metric-compatible with Arial, so Linux measures what the Windows gate measures. No test or code changes.
        run: |
          sudo apt-get install -y -qq fonts-liberation > /dev/null
          mkdir -p ~/.config/fontconfig
          cat > ~/.config/fontconfig/fonts.conf <<'EOF2'
          <?xml version="1.0"?><!DOCTYPE fontconfig SYSTEM "fonts.dtd">
          <fontconfig>
            <match target="pattern"><test qual="any" name="family"><string>sans-serif</string></test>
              <edit name="family" mode="prepend" binding="strong"><string>Liberation Sans</string></edit></match>
            <match target="pattern"><test qual="any" name="family"><string>sans</string></test>
              <edit name="family" mode="prepend" binding="strong"><string>Liberation Sans</string></edit></match>
          </fontconfig>
          EOF2
          fc-cache -f > /dev/null
          rm -rf ~/.java/fonts
          echo "sans-serif resolves to: $(fc-match sans-serif)"
      - name: Toolchain identity
        run: |
          java -version
          ./gradlew --no-daemon --version
          grep -E '^distribution(Url|Sha256Sum)=' gradle/wrapper/gradle-wrapper.properties
      - name: Extract foundation core.account at the pin
        run: ./gradlew --no-daemon fetchFoundationCore -PfoundationRepo="$GITHUB_WORKSPACE"
      - name: Full check on the pinned toolchain (-Werror)
        run: |
          set -o pipefail
          if [ "$RUNNER_OS" = Linux ]; then run="xvfb-run -a"; else run=""; fi
          $run ./gradlew --no-daemon clean check -PruneliteSource="$GITHUB_WORKSPACE/.ci/runelite" -PnoReviewAssets 2>&1 | tee check.log
      - name: Results
        if: always()
        run: grep -E '(passed|failed)|SKIP|SKIPPED|PASS$|UNPINNED|FAIL' check.log | grep -v '^\s*PASS ' || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r02-pinned-gate-${{ matrix.os }}
          path: check.log

  classpath-lock:
    name: classpath resolution and lock (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11.0.33+10'
      - name: Build the launcher
        run: ./gradlew --no-daemon launcherJar
      - name: Resolution A (compiles the host against the real RuneLite client 1.13.8)
        run: |
          ./gradlew --no-daemon -p playtest/host-plugin playtestClasspath
          mkdir -p .ci/lock
          cp playtest/host-plugin/build/playtest/classpath.txt .ci/lock/classpath-A.txt
      - name: Resolution B (fresh Gradle home, independent download)
        run: |
          export GRADLE_USER_HOME="$RUNNER_TEMP/gradle-home-b"
          ./gradlew --no-daemon -p playtest/host-plugin clean playtestClasspath
          cp playtest/host-plugin/build/playtest/classpath.txt .ci/lock/classpath-B.txt
      - name: A and B must agree exactly (SHA-256 and coordinate of every JAR)
        run: |
          set -e
          for x in A B; do grep -v '^#' .ci/lock/classpath-$x.txt | cut -d' ' -f1,2 | sort > .ci/lock/resolved-$x.txt; done
          diff -u .ci/lock/resolved-A.txt .ci/lock/resolved-B.txt
          echo "agree: $(wc -l < .ci/lock/resolved-A.txt) lines (host JAR included)"
      - name: Record the lock from resolution B and compare it with the committed lock
        run: |
          set -e
          committed=playtest/runelite-1.13.8.lock
          if [ -f "$committed" ]; then mv "$committed" .ci/lock/committed.lock; fi
          java -jar build/libs/raccoon-r02-launcher.jar record-lock --repo .
          cp "$committed" .ci/lock/runelite-1.13.8.lock
          echo "----- recorded lock (public coordinates and SHA-256 only) -----"
          cat .ci/lock/runelite-1.13.8.lock
          echo "----- end of recorded lock -----"
          sha256sum .ci/lock/runelite-1.13.8.lock
          if [ -f .ci/lock/committed.lock ]; then
            grep -v '^# reviewed:' .ci/lock/committed.lock > .ci/lock/c.txt
            grep -v '^# reviewed:' .ci/lock/runelite-1.13.8.lock > .ci/lock/r.txt
            diff -u .ci/lock/c.txt .ci/lock/r.txt
            echo "committed lock matches this independent resolution ($(grep -c '^[0-9a-f]\{64\} ' .ci/lock/r.txt) JARs)"
            mv .ci/lock/committed.lock "$committed"
          fi
      - name: Real-RuneLite compile record
        run: |
          ls -l playtest/host-plugin/build/libs/raccoon-r02-playtest-host.jar
          grep -c ' ' .ci/lock/resolved-B.txt
      - uses: actions/upload-artifact@v4
        with:
          name: r02-classpath-lock-${{ matrix.os }}
          path: |
            .ci/lock/resolved-A.txt
            .ci/lock/resolved-B.txt
            .ci/lock/runelite-1.13.8.lock
