name: fr-windows-playtest

# FR-006 Windows playtest kit: built from the accepted candidate, checked, and published as a
# workflow artifact for review (never released). The production tree must equal the candidate;
# the official JAR is the exact retained artifact, re-verified here.

on:
  push:
    branches:
      - test/fr-windows-playtest
  workflow_dispatch:
    inputs:
      client_runs:
        description: Attempt the unattended client runs (R2 replay and R4 launch path) on the Windows runner
        type: boolean
        default: true

permissions:
  contents: read

env:
  CANDIDATE: aefb1d79f680ef2c184e24b82e487db08d05c879
  CANDIDATE_DEV_JAR_SHA256: eebb6ecc7617dff9b98bb30f6f791da86dbc52ce72652d5017d38b7d0a12c51c
  CANDIDATE_DEV_JAR_BYTES: "75907"
  OFFICIAL_RUN: "45930961714"
  OFFICIAL_ARTIFACT: "15168762052"
  OFFICIAL_SHA256: 5eb3405a5be817340a626f4625859f47ec9591afc10e792322dd290d3b456bd5
  OFFICIAL_BYTES: "76270"

jobs:
  kit-parts:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 11.0.33+10

      - name: Production tree equals the accepted candidate
        run: |
          git cat-file -e "${CANDIDATE}^{commit}"
          git diff --exit-code --stat "$CANDIDATE" HEAD -- src build.gradle settings.gradle runelite-plugin.properties gradle gradlew gradlew.bat
          echo "::notice title=candidate::production tree (src, build files, wrapper) identical to ${CANDIDATE}"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fr-001-official-package-${{ env.CANDIDATE }}
          path: official-receipt
          run-id: ${{ env.OFFICIAL_RUN }}
          github-token: ${{ github.token }}

      - name: Re-verify the retained official JAR
        run: tools/verify/verify-retained.sh official-receipt "$CANDIDATE" . "$OFFICIAL_SHA256" "$OFFICIAL_BYTES"

      - name: Build kit parts
        run: |
          set -o pipefail
          ./gradlew --no-daemon --no-build-cache --init-script playtest/kit.gradle clean playtestKit 2>&1 | tee "${RUNNER_TEMP}/kit-build.log" \
            || { grep -qE 'Could not (GET|HEAD) |Connection reset|Read timed out|connect timed out|Received status code 5' "${RUNNER_TEMP}/kit-build.log" \
                 && sleep 20 && ./gradlew --no-daemon --no-build-cache --init-script playtest/kit.gradle clean playtestKit; }

      - name: Candidate development JAR is byte-identical
        run: |
          jar=build/playtest-kit/kit/lib/dev/project-raccoon.jar
          sha=$(sha256sum "$jar" | cut -d' ' -f1); bytes=$(stat -c %s "$jar")
          echo "::notice title=dev jar::bytes=$bytes sha256=$sha"
          test "$sha" = "$CANDIDATE_DEV_JAR_SHA256" && test "$bytes" = "$CANDIDATE_DEV_JAR_BYTES"
          java tools/verify/FoundationVerifier.java artifact . "$jar"

      - name: No playtest, test or launcher classes in production artifacts
        run: |
          python3 -I - official-receipt/project-raccoon.jar build/playtest-kit/kit/lib/dev/project-raccoon.jar build/playtest-kit/kit/lib/client build/playtest-kit/kit/lib/isolation <<'PY'
          import glob, os, re, sys, zipfile
          bad = re.compile(r"(/playtest/|Test\.class$|PluginHarness|NativeBankProbe|NativeEvaluationProbe|WitnessPlugin|PlaytestClient|R1Runner)")
          fail = False
          for jar in sys.argv[1:3]:
              hits = [n for n in zipfile.ZipFile(jar).namelist() if bad.search(n)]
              print(f"::notice title=artifact contents::{os.path.basename(os.path.dirname(jar))}/{os.path.basename(jar)}: {len(hits)} test/playtest entries {hits[:5]}")
              fail |= bool(hits)
          foreign = 0
          jars = glob.glob(os.path.join(sys.argv[3], "*.jar")) + glob.glob(os.path.join(sys.argv[4], "*.jar"))
          for jar in jars:
              foreign += sum(1 for n in zipfile.ZipFile(jar).namelist() if n.startswith("com/feralenterprises/"))
          print(f"::notice title=R4 client classpath::{len(jars)} jars, {foreign} Raccoon entries")
          sys.exit(1 if fail or foreign or not jars else 0)
          PY

      - name: Pinned client facts (RuneLite 1.13.8)
        run: |
          cj=$(ls build/playtest-kit/kit/lib/client/client-1.13.8*.jar | head -n1)
          cp=$(ls build/playtest-kit/kit/lib/client/*.jar | tr '\n' ':')
          side=$(javap -c -p -constants -cp "$cp" net.runelite.client.plugins.PluginManager | grep -ciE 'sideload|side-load' || true)
          home=$(javap -c -p -constants -cp "$cp" net.runelite.client.RuneLite | grep -cE 'String user\.home|String \.runelite' || true)
          prio=$(javap -cp "$cp" net.runelite.client.eventbus.Subscribe | grep -c 'float priority' || true)
          auth=$(unzip -l "$cj" | grep -ciE 'jagex.*(auth|account)|(auth|account).*jagex' || true)
          echo "::notice title=client facts::sideload references=$side; RUNELITE_DIR from user.home references=$home; Subscribe.priority=$prio; Jagex account/auth classes=$auth"
          javap -c -p -constants -cp "$cp" net.runelite.client.plugins.PluginManager | grep -iE 'sideload|side-load|developerMode|RUNELITE_DIR' | head -n 14
          echo "--- RuneLite data directory"
          javap -c -p -constants -cp "$cp" net.runelite.client.RuneLite | grep -E 'RUNELITE_DIR|String user\.home|String \.runelite' | head -n 8
          echo "--- EventBus programmatic registration (used by the witness)"
          javap -cp "$cp" net.runelite.client.eventbus.EventBus | grep -E 'register|unregister'
          echo "--- Jagex sign-in path (what the developer client's Jagex account panel uses)"
          for c in net.runelite.client.plugins.jagexauth.JagexAuthPlugin net.runelite.client.plugins.jagexauth.JagexAuthPanel net.runelite.client.rs.auth.JagexAuthService net.runelite.client.rs.auth.JagexAuthClient; do
            echo "[$c]"
            javap -c -p -constants -cp "$cp" "$c" | grep -oE 'LinkBrowser[.a-zA-Z]*|java/awt/Desktop[.a-zA-Z]*|com/sun/net/httpserver/[A-Za-z]*|String (https?://|localhost)[^ ]*|ServerSocket|JCEF|WebView|JFrame|JDialog' | sort -u | head -n 12
          done
          echo "--- PluginChanged (witness: late enable, disable/re-enable)"
          javap -cp "$cp" net.runelite.client.events.PluginChanged | grep -E 'getPlugin|isLoaded'
          echo "--- Jagex auth storage"
          for c in net.runelite.client.rs.auth.JagexAuthService net.runelite.client.plugins.jagexauth.JagexAuthPlugin; do
            javap -c -p -constants -cp "$cp" "$c" | grep -E 'RUNELITE_DIR|String [^ ]*(\.json|\.properties|credentials|token)|ConfigManager|setConfiguration' | head -n 8
          done
          unzip -l "$cj" | grep -iE 'jagex.*(auth|account)|(auth|account).*jagex' | head -n 12 || true
          test "$side" -gt 0 && test "$home" -gt 0 && test "$prio" -gt 0

      - name: Locations outside user.home referenced by the client (isolation scan)
        run: |
          python3 -I - build/playtest-kit/kit/lib <<'PY'
          import glob, os, sys, zipfile
          needles = {"java/util/prefs/Preferences": "Java preferences (Windows registry)", "LOCALAPPDATA": "env LOCALAPPDATA",
                     "APPDATA": "env APPDATA", "USERPROFILE": "env USERPROFILE", "user.home": "user.home"}
          for jar in sorted(glob.glob(os.path.join(sys.argv[1], "*", "*.jar"))):
              hits = {}
              with zipfile.ZipFile(jar) as z:
                  for n in z.namelist():
                      if not n.endswith(".class"):
                          continue
                      data = z.read(n)
                      for k, label in needles.items():
                          if k.encode() in data:
                              hits.setdefault(label, []).append(n[:-6].replace("/", "."))
              for label, classes in hits.items():
                  print(f"::notice title=isolation scan::{os.path.basename(jar)}: {label}: {len(classes)} classes, e.g. {', '.join(classes[:6])}")
          PY

      - name: Missing evidence evaluates as BLOCKED
        run: |
          cp="build/playtest-kit/kit/lib/client/*:build/playtest-kit/kit/lib/dev/*"
          : > "${RUNNER_TEMP}/empty.jsonl"
          set +e
          java -cp "$cp" com.feralenterprises.raccoon.playtest.Evaluate R3 "${RUNNER_TEMP}/empty.jsonl"; r3=$?
          java -cp "$cp" com.feralenterprises.raccoon.playtest.Evaluate R4 missing.log missing.jar "$OFFICIAL_SHA256" "build/playtest-kit/kit/lib/client;build/playtest-kit/kit/lib/isolation"; r4=$?
          set -e
          echo "::notice title=evaluator::empty R3 receipt exit=$r3 (2 = BLOCKED); missing R4 evidence exit=$r4 (1 = FAIL: no sideloaded JAR)"
          test "$r3" = 2 && test "$r4" = 1

      - name: Add the retained official JAR
        run: |
          mkdir -p build/playtest-kit/kit/official
          cp official-receipt/project-raccoon.jar build/playtest-kit/kit/official/project-raccoon.jar

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kit-parts
          path: build/playtest-kit/kit
          if-no-files-found: error
          retention-days: 7

  kit-tests:
    # evaluator regressions in their own job, so a failure here never hides the Windows results
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 11.0.33+10

      - name: Evaluator regression tests (kit review a0ef3e4c)
        run: |
          set +e
          ./gradlew --no-daemon --no-build-cache --init-script playtest/kit.gradle playtestTest; code=$?
          set -e
          python3 -I - <<'PY'
          import glob, xml.etree.ElementTree as ET
          t = f = 0
          for x in glob.glob("build/test-results/playtestTest/*.xml"):
              r = ET.parse(x).getroot(); t += int(r.get("tests")); f += int(r.get("failures")) + int(r.get("errors"))
              for c in r.iter("testcase"):
                  for bad in list(c.findall("failure")) + list(c.findall("error")):
                      print(f"::error title=evaluator test {c.get('name')}::{(bad.get('message') or '')[:300]}")
          print(f"::notice title=evaluator tests::{t} run, {f} failed")
          PY
          exit $code


  windows-kit:
    needs: kit-parts
    runs-on: windows-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kit-parts
          path: ${{ runner.temp }}/kit

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 11.0.33+10

      - name: Bundle the Java runtime and write the kit manifest
        run: |
          $ErrorActionPreference = 'Stop'
          $kit = Join-Path $env:RUNNER_TEMP 'kit'
          robocopy $env:JAVA_HOME (Join-Path $kit 'runtime') /E /NFL /NDL /NJH /NJS /XD jmods /XF src.zip | Out-Null
          if ($LASTEXITCODE -ge 8) { throw "robocopy failed: $LASTEXITCODE" }
          $javaExe = Join-Path $kit 'runtime\bin\java.exe'
          $v = cmd /c "`"$javaExe`" -version 2>&1"
          Write-Host "::notice title=runtime::$($v -join ' | ')"
          $files = Get-ChildItem $kit -Recurse -File | Where-Object { $_.Name -ne 'kit-manifest.json' } | Sort-Object FullName | ForEach-Object {
            [ordered]@{ path = $_.FullName.Substring($kit.Length + 1); sha256 = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant() }
          }
          $m = [ordered]@{
            candidate = $env:CANDIDATE; kitCommit = $env:GITHUB_SHA; kind = 'FR-006 playtest kit'
            runelite = '1.13.8'; runtime = 'Temurin 11.0.33+10 windows-x64'
            devJar = [ordered]@{ sha256 = $env:CANDIDATE_DEV_JAR_SHA256; bytes = [int]$env:CANDIDATE_DEV_JAR_BYTES }
            official = [ordered]@{ sha256 = $env:OFFICIAL_SHA256; bytes = [int]$env:OFFICIAL_BYTES; run = $env:OFFICIAL_RUN; artifact = $env:OFFICIAL_ARTIFACT }
            files = @($files)
          }
          $m | ConvertTo-Json -Depth 5 | Set-Content -Encoding UTF8 (Join-Path $kit 'kit-manifest.json')
          $size = (Get-ChildItem $kit -Recurse -File | Measure-Object Length -Sum).Sum
          Write-Host "::notice title=kit::$(@($files).Count) files, $([math]::Round($size / 1MB)) MiB, manifest written"
          robocopy $kit (Join-Path $env:RUNNER_TEMP 'kit-run') /E /NFL /NDL /NJH /NJS | Out-Null
          if ($LASTEXITCODE -ge 8) { throw "robocopy failed: $LASTEXITCODE" }
          exit 0

      - name: Kit self-check (Windows PowerShell 5.1)
        run: |
          & (Join-Path $env:RUNNER_TEMP 'kit-run\Raccoon-Playtest.ps1') -Step SelfCheck -NonInteractive
          exit $LASTEXITCODE

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: src
          persist-credentials: false

      - name: Launcher regression tests (kit review a0ef3e4c)
        run: |
          & powershell -NoProfile -ExecutionPolicy Bypass -File src\playtest\tests\Launcher.Tests.ps1 (Join-Path $env:RUNNER_TEMP 'kit-run\Raccoon-Playtest.ps1')
          exit $LASTEXITCODE

      - name: R1 on the Windows runner (deterministic regression replay)
        run: |
          & (Join-Path $env:RUNNER_TEMP 'kit-run\Raccoon-Playtest.ps1') -Step R1 -NonInteractive
          exit $LASTEXITCODE

      - name: Unattended R2 attempt (genuine client, login screen only)
        if: github.event_name == 'push' || inputs.client_runs
        continue-on-error: true
        timeout-minutes: 14
        run: |
          & (Join-Path $env:RUNNER_TEMP 'kit-run\Raccoon-Playtest.ps1') -Step R2 -NonInteractive
          Write-Host "::notice title=R2 attempt::exit $LASTEXITCODE (0 PASS, 1 FAIL, 2 BLOCKED); CI runner, not an owner receipt"
          exit $LASTEXITCODE

      - name: Unattended R4 launch-path attempt (official JAR side-loaded; not R4)
        if: github.event_name == 'push' || inputs.client_runs
        continue-on-error: true
        timeout-minutes: 8
        run: |
          & (Join-Path $env:RUNNER_TEMP 'kit-run\Raccoon-Playtest.ps1') -Step Smoke -NonInteractive -SmokeSeconds 240
          Write-Host "::notice title=launch path::exit $LASTEXITCODE (0 PASS, 1 FAIL, 2 BLOCKED); CI runner, not R4"
          exit $LASTEXITCODE

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-receipts
          path: ${{ runner.temp }}/kit-run/receipts
          if-no-files-found: warn

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: raccoon-playtest-kit
          path: ${{ runner.temp }}/kit
          if-no-files-found: error
          retention-days: 30
